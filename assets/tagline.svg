<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k0">the bug was me. it&apos;s always me.</text>
<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k1">currently: deep in a rabbit hole, send help.</text>
<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k2">404: free time not found.</text>
<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k3">git commit -m &apos;fixed it (broke 3 other things)&apos;</text>
<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k4">currently debugging: life.exe</text>
<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k5">yes i read the error message. no it didn&apos;t help.</text>
<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k6">my code works and i don&apos;t know why either.</text>
<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k7">asked the rubber duck. the rubber duck knew.</text>
<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k8">works locally. shipping anyway.</text>
<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k9">i have opinions about folder structure.</text>
<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k10">the documentation existed. i wrote it myself.</text>
<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k11">no i haven&apos;t pushed yet. yes i&apos;m scared.</text>
<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k12">merge conflict? that&apos;s a conversation starter.</text>
<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k13">closing 47 tabs doesn&apos;t count as productivity. yet.</text>
<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k14">asked the rubber duck. rubber duck was right.</text>
<text class="line" x="32" y="29" font-family="'Fira Code',monospace" font-size="13" fill="#53F7AE" style="animation-name:k15">senior by stack overflow, junior by humility.</text>
