<svg width="450" height="180" viewBox="0 0 450 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text { 
      font-family: 'Fira Code', 'Courier New', monospace; 
      font-size: 22px; 
      fill: #53F7AE; 
      font-weight: 600;
    }
  </style>

  <mask id="mask0"><rect x="10" y="0" width="0" height="30" fill="white"><animate attributeName="width" from="0" to="400" dur="1s" begin="0s" fill="freeze" /></rect></mask>
  <mask id="mask1"><rect x="50" y="30" width="0" height="30" fill="white"><animate attributeName="width" from="0" to="400" dur="2s" begin="1s" fill="freeze" /></rect></mask>
  <mask id="mask2"><rect x="50" y="60" width="0" height="30" fill="white"><animate attributeName="width" from="0" to="400" dur="2s" begin="3s" fill="freeze" /></rect></mask>
  <mask id="mask3"><rect x="10" y="90" width="0" height="30" fill="white"><animate attributeName="width" from="0" to="400" dur="2s" begin="5s" fill="freeze" /></rect></mask>
  <mask id="mask4"><rect x="50" y="120" width="0" height="30" fill="white"><animate attributeName="width" from="0" to="400" dur="2s" begin="7s" fill="freeze" /></rect></mask>

  <text x="10" y="25" class="text" mask="url(#mask0)">try:</text>
  <text x="50" y="53" class="text" mask="url(#mask1)">understand_first()</text>
  <text x="50" y="81" class="text" mask="url(#mask2)">then_build()</text>
  <text x="10" y="109" class="text" mask="url(#mask3)">except shortcuts:</text>
  <text x="50" y="137" class="text" mask="url(#mask4)">raise BetterQuestion</text>
</svg>